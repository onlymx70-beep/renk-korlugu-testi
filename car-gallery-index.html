<!doctype html><html lang="az"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Premium avtomobil qalereyası"><title>Car Gallery</title><style>
*{box-sizing:border-box}body{margin:0;background:#080a0f;color:#fff;font-family:Arial,sans-serif}.wrap{width:92%;max-width:1100px;margin:auto}header{padding:22px 0;border-bottom:1px solid #252a33}.logo{font-size:22px;font-weight:900}.logo span{color:#9aa4b2}.hero{padding:55px 0 30px}.hero h1{font-size:clamp(40px,8vw,72px);line-height:.95;margin:0 0 16px}.hero p{color:#9aa4b2;max-width:650px;font-size:17px}.search{width:100%;padding:15px;border-radius:14px;border:1px solid #252a33;background:#11151d;color:#fff;font-size:16px;margin-top:20px}.filters{display:flex;gap:8px;overflow:auto;padding:8px 0 25px}.filter{border:1px solid #252a33;background:#11151d;color:#ddd;border-radius:30px;padding:10px 15px;white-space:nowrap}.filter.active{background:#fff;color:#000}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.car{background:#11151d;border:1px solid #252a33;border-radius:18px;overflow:hidden}.photo{height:210px}.photo img{width:100%;height:100%;object-fit:cover}.info{padding:16px}.brand{font-size:12px;color:#9aa4b2;text-transform:uppercase;letter-spacing:1px}.name{font-size:21px;font-weight:800;margin:5px 0}.spec{color:#9aa4b2;font-size:14px}.row{display:flex;justify-content:space-between;align-items:center;margin-top:15px}.view,.fav{border:1px solid #303744;background:#171c25;color:#fff;border-radius:10px;padding:9px 12px}.fav{font-size:19px}.empty{text-align:center;color:#9aa4b2;padding:50px;display:none}footer{padding:35px 0;color:#777}@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}.photo{height:220px}}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:5;padding:20px}.box{max-width:650px;margin:7vh auto;background:#11151d;border:1px solid #303744;border-radius:20px;overflow:hidden}.box img{width:100%;height:300px;object-fit:cover}.content{padding:20px}.close{float:right;background:#222936;color:#fff;border:0;padding:8px 12px;border-radius:9px}
</style></head><body><header><div class="wrap"><div class="logo">CAR<span>GALLERY</span></div></div></header><main class="wrap"><section class="hero"><h1>Drive your<br>dream.</h1><p>Sevdiyin avtomobilləri kəşf et. Axtar, marka üzrə filtrələ və modellər haqqında məlumatlara bax.</p><input id="search" class="search" placeholder="Məsələn: G63, M5, RS7..."></section><div id="filters" class="filters"></div><section id="grid" class="grid"></section><div id="empty" class="empty">Uyğun avtomobil tapılmadı.</div></main><footer><div class="wrap">Car Gallery · Demo avtomobil qalereyası</div></footer><div id="modal" class="modal"><div class="box"><img id="mi"><div class="content"><button class="close" onclick="modal.style.display='none'">Bağla</button><div id="mb" class="brand"></div><h2 id="mn"></h2><p id="md" class="spec"></p></div></div></div>
<script>
const cars=[
["G 63 AMG","Mercedes","2024","4.0L V8","585 HP","https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?auto=format&fit=crop&w=1200&q=85"],
["M5 Competition","BMW","2025","4.4L V8 Hybrid","717 HP","https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=1200&q=85"],
["RS 7","Audi","2024","4.0L V8","591 HP","https://images.unsplash.com/photo-1606664515524-ed2f786a0bd6?auto=format&fit=crop&w=1200&q=85"],
["911 Turbo S","Porsche","2025","3.7L Flat-6","640 HP","https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=1200&q=85"],
["Supra GR","Toyota","2024","3.0L Turbo","382 HP","https://images.unsplash.com/photo-1625047509248-ec889cbff17f?auto=format&fit=crop&w=1200&q=85"],
["M4 Competition","BMW","2025","3.0L Twin Turbo","503 HP","https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=1200&q=85"]];
let active="Hamısı",fav=new Set(JSON.parse(localStorage.getItem("cgfav")||"[]"));
const grid=document.getElementById("grid"),search=document.getElementById("search");
["Hamısı",...new Set(cars.map(x=>x[1]))].forEach(x=>{let b=document.createElement("button");b.className="filter"+(x==="Hamısı"?" active":"");b.textContent=x;b.onclick=()=>{active=x;document.querySelectorAll(".filter").forEach(z=>z.classList.remove("active"));b.classList.add("active");render()};filters.appendChild(b)});
function render(){let t=search.value.toLowerCase(),list=cars.map((x,i)=>[x,i]).filter(([x])=>(active==="Hamısı"||x[1]===active)&&x.join(" ").toLowerCase().includes(t));grid.innerHTML="";empty.style.display=list.length?"none":"block";list.forEach(([x,i])=>{let e=document.createElement("article");e.className="car";e.innerHTML=`<div class="photo"><img src="${x[5]}" alt="${x[1]} ${x[0]}" loading="lazy"></div><div class="info"><div class="brand">${x[1]}</div><div class="name">${x[0]}</div><div class="spec">${x[2]} · ${x[3]} · ${x[4]}</div><div class="row"><button class="view">Ətraflı</button><button class="fav">${fav.has(i)?"♥":"♡"}</button></div></div>`;e.querySelector(".view").onclick=()=>open(x);e.querySelector(".fav").onclick=()=>{fav.has(i)?fav.delete(i):fav.add(i);localStorage.setItem("cgfav",JSON.stringify([...fav]));render()};grid.appendChild(e)})}
function open(x){mi.src=x[5];mb.textContent=x[1];mn.textContent=x[0];md.textContent=`${x[2]} · ${x[3]} · ${x[4]}`;modal.style.display="block"}search.oninput=render;modal.onclick=e=>{if(e.target===modal)modal.style.display="none"};render();
</script></body></html>
